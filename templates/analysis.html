<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Analysis</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perf1.css') }}">
    <!-- Load Chart.js from CDN with specific version -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo2.png') }}" alt="Logo" class="logo">
                <div class="editor">SPMS</div>
            </div>
            <ul>
                <li><a href="perf1.html">Home <span class="icon">🏠</span></a></li>
                <li><a href="analysis.html">Analysis <span class="icon">📊</span></a></li>
                <li><a href="#logout">Logout <span class="icon">🚪</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Student Performance Analysis</h1>

        <section id="searchContainer">
            <div class="search-bar">
                <input type="text" id="rollNoSearch" placeholder="Enter Roll No to search...">
                <button id="searchStudent">Search</button>
            </div>
            <div class="overall-analysis">
                <h2>Overall Analysis</h2>
                <div class="form-group">
                    <label for="departmentSelect">Select Department:</label>
                    <select id="departmentSelect">
                        <option value="">-- Select Department --</option>
                    </select>
                    <div id="departmentCgpaChange" class="cgpa-change-box"></div>
                </div>
                <div class="form-group">
                    <label for="courseCodeSelect">Select Course Code:</label>
                    <select id="courseCodeSelect">
                        <option value="">-- Select Course Code --</option>
                    </select>
                    <div id="courseCgpaChange" class="cgpa-change-box"></div>
                </div>
            </div>
            <div id="studentDetails" class="student-details">
                <h2>Student GPA Performance</h2>
                <div id="studentForm" class="student-form">
                    <!-- Student details and chart will be populated here -->
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/analysis.js') }}"></script>
</body>
</html>
